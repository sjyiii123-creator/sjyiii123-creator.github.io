<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>李正淼 · 算法工程师 | LEGO-style Resume</title>
<meta name="description" content="算法工程师李正淼的个人简历网站 —— 乐高积木风格，包含工作经历、技能、作品集与联系方式。">
<link rel="icon" href="assets/brick.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.min.css?v=720d93d2">
</head>
<body>

<!-- ============ 章节跳转积木过场（多变体） ============ -->
<div class="brick-transition anim-rain" id="brickTransition" aria-hidden="true">
  <div class="bt-layer bt-cols">
    <div class="bt-col" style="--i:0"></div><div class="bt-col" style="--i:1"></div>
    <div class="bt-col" style="--i:2"></div><div class="bt-col" style="--i:3"></div>
    <div class="bt-col" style="--i:4"></div><div class="bt-col" style="--i:5"></div>
    <div class="bt-col" style="--i:6"></div><div class="bt-col" style="--i:7"></div>
    <div class="bt-col" style="--i:8"></div><div class="bt-col" style="--i:9"></div>
  </div>
  <div class="bt-layer bt-rows">
    <div class="bt-row" style="--i:0"></div><div class="bt-row" style="--i:1"></div>
    <div class="bt-row" style="--i:2"></div><div class="bt-row" style="--i:3"></div>
    <div class="bt-row" style="--i:4"></div>
  </div>
  <div class="bt-layer bt-grid">
    <div class="bt-cell" style="--i:0"></div><div class="bt-cell alt" style="--i:1"></div><div class="bt-cell" style="--i:2"></div><div class="bt-cell alt" style="--i:3"></div><div class="bt-cell" style="--i:4"></div><div class="bt-cell alt" style="--i:5"></div>
    <div class="bt-cell alt" style="--i:1"></div><div class="bt-cell" style="--i:2"></div><div class="bt-cell alt" style="--i:3"></div><div class="bt-cell" style="--i:4"></div><div class="bt-cell alt" style="--i:5"></div><div class="bt-cell" style="--i:6"></div>
    <div class="bt-cell" style="--i:2"></div><div class="bt-cell alt" style="--i:3"></div><div class="bt-cell" style="--i:4"></div><div class="bt-cell alt" style="--i:5"></div><div class="bt-cell" style="--i:6"></div><div class="bt-cell alt" style="--i:7"></div>
    <div class="bt-cell alt" style="--i:3"></div><div class="bt-cell" style="--i:4"></div><div class="bt-cell alt" style="--i:5"></div><div class="bt-cell" style="--i:6"></div><div class="bt-cell alt" style="--i:7"></div><div class="bt-cell" style="--i:8"></div>
  </div>
  <div class="bt-layer bt-curtain">
    <div class="bt-half l"></div><div class="bt-half r"></div>
  </div>
  <div class="bt-layer bt-core"><div class="bt-core-box"></div></div>
  <div class="bt-layer bt-smileys" id="btSmileys"></div>
  <div class="bt-label" id="btLabel"><span class="bt-label-brick"></span><span id="btLabelText">首页</span></div>
</div>

<!-- ============ 乐高小火车进度条 ============ -->
<div class="train-track" id="trainTrack" aria-hidden="true">
  <div class="train-rail"></div>
  <div class="rail-fill" id="railFill"></div>
  <div class="train-ties"></div>
  <div class="lego-train" id="legoTrain">
    <svg viewBox="0 0 150 56" class="train-svg">
      <!-- 烟囱烟雾 -->
      <g class="smoke">
        <circle cx="20" cy="8" r="4"/><circle cx="29" cy="4" r="3"/><circle cx="36" cy="1" r="2.2"/>
      </g>
      <!-- 车头 -->
      <rect x="14" y="16" width="44" height="22" rx="3" fill="#E30613" stroke="#8B0000" stroke-width="2"/>
      <rect x="22" y="8" width="12" height="10" rx="2" fill="#E30613" stroke="#8B0000" stroke-width="2"/>
      <rect x="10" y="20" width="8" height="14" rx="2" fill="#FFC400" stroke="#B8860B" stroke-width="2"/>
      <rect x="40" y="21" width="12" height="10" rx="2" fill="#7EC8FF" stroke="#2A6FA8" stroke-width="2"/>
      <!-- 车厢1 -->
      <rect x="62" y="20" width="36" height="18" rx="3" fill="#FFC400" stroke="#B8860B" stroke-width="2"/>
      <circle cx="72" cy="29" r="3.6" fill="#fff" stroke="#B8860B" stroke-width="1.6"/>
      <circle cx="82" cy="29" r="3.6" fill="#fff" stroke="#B8860B" stroke-width="1.6"/>
      <circle cx="92" cy="29" r="3.6" fill="#fff" stroke="#B8860B" stroke-width="1.6"/>
      <!-- 车厢2 -->
      <rect x="102" y="22" width="34" height="16" rx="3" fill="#00A651" stroke="#00622E" stroke-width="2"/>
      <circle cx="112" cy="30" r="3.2" fill="#fff" stroke="#00622E" stroke-width="1.6"/>
      <circle cx="122" cy="30" r="3.2" fill="#fff" stroke="#00622E" stroke-width="1.6"/>
      <circle cx="132" cy="30" r="3.2" fill="#fff" stroke="#00622E" stroke-width="1.6"/>
      <!-- 车轮 -->
      <g class="wheels">
        <circle class="wheel" cx="24" cy="43" r="7"/><circle class="wheel" cx="48" cy="43" r="7"/>
        <circle class="wheel" cx="76" cy="43" r="6"/><circle class="wheel" cx="94" cy="43" r="6"/>
        <circle class="wheel" cx="116" cy="43" r="5.6"/><circle class="wheel" cx="132" cy="43" r="5.6"/>
      </g>
    </svg>
    <div class="train-percent" id="trainPercent">0%</div>
  </div>
</div>

<!-- ============ 欢迎过场 ============ -->
<div class="welcome-overlay" id="welcomeOverlay">
  <div class="brick-field" id="brickField"></div>
  <div class="welcome-card">
    <div class="welcome-studs"><i></i><i></i><i></i><i></i></div>
    <p class="welcome-eyebrow" id="welcomeEyebrow">WELCOME</p>
    <h1 class="welcome-title" id="welcomeTitle">欢迎来到我的积木世界</h1>
    <p class="welcome-sub" id="welcomeSub">下滑开始探索 →</p>
    <button class="welcome-btn" id="welcomeBtn">
      <span class="btn-studs"><i></i><i></i><i></i><i></i></span>
      <span id="welcomeBtnText">开始探索</span>
    </button>
  </div>
</div>

<!-- ============ 侧边栏 ============ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-studs" aria-hidden="true"></div>
  <div class="sidebar-inner">
    <div class="avatar-brick">
      <div class="avatar-studs"><i></i><i></i></div>
      <div class="avatar-face" id="avatarText">李</div>
    </div>
    <h2 class="side-name" id="sideName">李正淼</h2>
    <p class="side-title" id="sideTitle">算法工程师</p>
    <p class="side-slogan" id="sideSlogan">Algorithm Engineer · LEGO Builder</p>

    <nav class="side-nav" id="sideNav">
      <a href="#hero" class="nav-brick active" data-target="hero"><span class="nav-dot"></span>首页</a>
      <a href="#about" class="nav-brick" data-target="about"><span class="nav-dot"></span>关于我</a>
      <a href="#experience" class="nav-brick" data-target="experience"><span class="nav-dot"></span>工作经历</a>
      <a href="#skills" class="nav-brick" data-target="skills"><span class="nav-dot"></span>技能</a>
      <a href="#projects" class="nav-brick" data-target="projects"><span class="nav-dot"></span>作品集</a>
      <a href="#education" class="nav-brick" data-target="education"><span class="nav-dot"></span>教育背景</a>
      <a href="#contact" class="nav-brick" data-target="contact"><span class="nav-dot"></span>联系方式</a>
    </nav>

    <div class="side-links" id="sideLinks"></div>
    <button class="side-edit-btn" id="openAdmin" title="仅站长可编辑">🔧 站长入口</button>
    <p class="side-hint">访客只读 · 可留言联系</p>
  </div>
</aside>

<!-- ============ 主内容 ============ -->
<main class="content" id="content">

  <!-- Hero -->
  <section class="hero section" id="hero">
    <div class="hero-bricks" aria-hidden="true">
      <div class="float-brick b1"></div><div class="float-brick b2"></div>
      <div class="float-brick b3"></div><div class="float-brick b4"></div>
      <div class="float-brick b5"></div>
    </div>
    <div class="hero-figs" aria-hidden="true">
      <div class="fig-slot" data-fig="heroWave"></div>
      <div class="brick-prop"></div>
      <div class="fig-slot" data-fig="heroBuild"></div>
    </div>
    <div class="hero-body">
      <p class="hero-eyebrow reveal">HELLO, I'M</p>
      <h1 class="hero-name reveal" id="heroName">李正淼</h1>
      <h2 class="hero-role reveal" id="heroRole">算法工程师</h2>
      <p class="hero-motto reveal" id="heroMotto">"把复杂的模型，拼成简单的积木"</p>
      <div class="hero-cta reveal">
        <a href="#projects" class="btn btn-yellow"><span class="btn-studs"><i></i><i></i><i></i><i></i></span>看看作品</a>
        <a href="#contact" class="btn btn-navy"><span class="btn-studs"><i></i><i></i><i></i><i></i></span>联系我</a>
      </div>
      <div class="hero-stats reveal" id="heroStats"></div>
    </div>
  </section>

  <!-- 关于我 -->
  <section class="section" id="about">
    <div class="section-head reveal">
      <span class="brick-icon red"></span>
      <h2>关于我</h2>
      <span class="head-line"></span>
    </div>
    <div class="about-grid">
      <div class="brick-card about-card reveal">
        <div class="card-studs"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <p class="about-text" id="aboutText"></p>
      </div>
      <div class="about-highlights" id="aboutHighlights"></div>
    </div>
  </section>

  <!-- 工作经历 -->
  <section class="section" id="experience">
    <div class="section-head reveal">
      <span class="brick-icon yellow"></span>
      <h2>工作经历</h2>
      <span class="head-line"></span>
    </div>
    <div class="timeline" id="timeline"></div>
  </section>

  <!-- 技能 -->
  <section class="section" id="skills">
    <div class="section-head reveal">
      <span class="brick-icon green"></span>
      <h2>技能</h2>
      <span class="head-line"></span>
    </div>
    <div class="skills-grid" id="skillsGrid"></div>
  </section>

  <!-- 作品集 -->
  <section class="section" id="projects">
    <div class="section-head reveal">
      <span class="brick-icon blue"></span>
      <h2>作品集</h2>
      <span class="head-line"></span>
    </div>
    <p class="section-sub reveal">6 个用积木拼出来的项目 · 悬停查看</p>
    <div class="projects-grid" id="projectsGrid"></div>
  </section>

  <!-- 小人游行 -->
  <div class="minifig-parade reveal" aria-hidden="true">
    <div class="parade-sun"></div>
    <div class="parade-ground"></div>
    <div class="fig-slot" data-fig="walk1"></div>
    <div class="parade-brick" style="background:#E30613;box-shadow:0 5px 0 #A80009"></div>
    <div class="fig-slot" data-fig="walk2"></div>
    <div class="parade-brick" style="background:#FFC400;box-shadow:0 5px 0 #D9A400"></div>
    <div class="fig-slot" data-fig="walk3"></div>
    <div class="parade-brick" style="background:#00A651;box-shadow:0 5px 0 #00702F"></div>
    <div class="fig-slot" data-fig="walk4"></div>
  </div>

  <!-- 教育背景 -->
  <section class="section" id="education">
    <div class="section-head reveal">
      <span class="brick-icon navy"></span>
      <h2>教育背景</h2>
      <span class="head-line"></span>
    </div>
    <div class="edu-grid" id="eduGrid"></div>
  </section>

  <!-- 联系方式 -->
  <section class="section" id="contact">
    <div class="section-head reveal">
      <span class="brick-icon red"></span>
      <h2 id="contactTitle">联系方式</h2>
      <span class="head-line"></span>
    </div>
    <div class="contact-wrap">
      <div class="brick-card contact-card reveal">
        <div class="card-studs"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <p class="contact-note" id="contactNote"></p>
        <ul class="contact-list" id="contactList"></ul>
        <p class="contact-readonly">🔒 本站为只读展示，内容仅站长可修改</p>
      </div>
      <form class="brick-card message-card reveal" id="messageForm">
        <div class="card-studs"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <h3>给我留言</h3>
        <label>你的称呼<input type="text" id="msgName" placeholder="怎么称呼你？" required></label>
        <label>联系方式<input type="text" id="msgContact" placeholder="邮箱 / 微信 / 电话" required></label>
        <label>留言内容<textarea id="msgBody" rows="4" placeholder="想聊点什么？" required></textarea></label>
        <button type="submit" class="btn btn-red"><span class="btn-studs"><i></i><i></i><i></i><i></i></span>发送留言</button>
        <p class="form-tip">点击后将调用你的邮件客户端发送给站长 📮</p>
      </form>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-bricks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="footer-figs" aria-hidden="true">
      <div class="fig-slot" data-fig="foot1"></div>
      <div class="fig-slot" data-fig="foot2"></div>
    </div>
    <p id="footerText"></p>
  </footer>
</main>

<script src="js/app.min.js?v=2518bbb4"></script>
</body>
</html>
