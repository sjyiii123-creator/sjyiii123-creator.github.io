<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="skyBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F2FF"/>
      <stop offset="100%" stop-color="#CFE2FA"/>
    </linearGradient>
    <pattern id="bgStuds" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="21" r="7" fill="#0B2A5B" opacity="0.05"/>
      <circle cx="20" cy="19" r="7" fill="#FFFFFF" opacity="0.65"/>
    </pattern>
    <linearGradient id="headGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="35%" stop-color="#FFCA1A"/>
      <stop offset="80%" stop-color="#F2B600"/>
      <stop offset="100%" stop-color="#CFA000"/>
    </linearGradient>
    <linearGradient id="suitNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E4E96"/>
      <stop offset="100%" stop-color="#0B2A5B"/>
    </linearGradient>
    <linearGradient id="hairDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D3A4F"/>
      <stop offset="100%" stop-color="#161F2E"/>
    </linearGradient>
    <filter id="pShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0B2A5B" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="400" height="480" fill="url(#skyBg)"/>
  <rect width="400" height="480" fill="url(#bgStuds)"/>
  <circle cx="200" cy="210" r="135" fill="#FFFFFF" opacity="0.55"/>

  <!-- 乐高工程师半身肖像占位图（支持一键替换为真实个人照片） -->
  <g filter="url(#pShadow)">
    <!-- 肩部与西装躯干 -->
    <path d="M88 430 L106 302 Q112 276 140 276 L260 276 Q288 276 294 302 L312 430 Z" fill="url(#suitNavy)"/>
    <!-- 衬衫与领带 -->
    <polygon points="172,276 228,276 200,342" fill="#FFFFFF"/>
    <polygon points="193,292 207,292 212,366 200,382 188,366" fill="#E62432"/>
    <!-- 胸前 LEGO 铭牌 -->
    <rect x="226" y="318" width="46" height="24" rx="5" fill="#FFCA1A"/>
    <text x="249" y="331" font-family="Nunito,sans-serif" font-weight="900" font-size="11" fill="#0B2A5B" text-anchor="middle" dominant-baseline="middle">AI · LEE</text>

    <!-- 颈部 -->
    <rect x="174" y="248" width="52" height="32" rx="6" fill="url(#headGold)"/>

    <!-- 头部 -->
    <rect x="128" y="118" width="144" height="136" rx="34" fill="url(#headGold)"/>
    <!-- 头部高光 -->
    <rect x="142" y="134" width="14" height="84" rx="7" fill="#FFFFFF" opacity="0.45"/>

    <!-- 乐高造型发型（带顶部凸点） -->
    <rect x="166" y="84" width="28" height="12" rx="4" fill="url(#hairDark)"/>
    <rect x="206" y="84" width="28" height="12" rx="4" fill="url(#hairDark)"/>
    <path d="M122 146 Q120 94 200 94 Q280 94 278 146 Q256 122 200 124 Q144 122 122 146 Z" fill="url(#hairDark)"/>

    <!-- 眼镜框与五官 -->
    <rect x="148" y="164" width="44" height="30" rx="8" fill="none" stroke="#1B2638" stroke-width="4.5"/>
    <rect x="208" y="164" width="44" height="30" rx="8" fill="none" stroke="#1B2638" stroke-width="4.5"/>
    <line x1="192" y1="178" x2="208" y2="178" stroke="#1B2638" stroke-width="4.5"/>
    <circle cx="170" cy="179" r="6.5" fill="#1B2638"/>
    <circle cx="230" cy="179" r="6.5" fill="#1B2638"/>
    <circle cx="172.5" cy="176.5" r="2.2" fill="#FFFFFF"/>
    <circle cx="232.5" cy="176.5" r="2.2" fill="#FFFFFF"/>
    <!-- 眉毛 -->
    <path d="M154 152 Q170 145 186 151" fill="none" stroke="#1B2638" stroke-width="4" stroke-linecap="round"/>
    <path d="M214 151 Q230 145 246 152" fill="none" stroke="#1B2638" stroke-width="4" stroke-linecap="round"/>
    <!-- 自信微笑 -->
    <path d="M174 216 Q200 236 226 216" fill="none" stroke="#1B2638" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 底部提示条 -->
  <rect x="44" y="418" width="312" height="40" rx="20" fill="#0B2A5B" opacity="0.88"/>
  <text x="200" y="439" font-family="Nunito,PingFang SC,Microsoft YaHei,sans-serif" font-weight="800" font-size="13.5" fill="#FFCA1A" text-anchor="middle" dominant-baseline="middle" letter-spacing="1">📷 个人照片位 · 点击可上传真实照片</text>
</svg>
