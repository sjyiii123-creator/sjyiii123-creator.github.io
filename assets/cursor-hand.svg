<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <defs>
    <linearGradient id="gy" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFE477"/>
      <stop offset="52%" stop-color="#FFD028"/>
      <stop offset="100%" stop-color="#E5A90D"/>
    </linearGradient>
    <linearGradient id="gr" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#F5333B"/>
      <stop offset="55%" stop-color="#E3000B"/>
      <stop offset="100%" stop-color="#B80009"/>
    </linearGradient>
    <filter id="ds" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.3" stdDeviation="1.1" flood-color="#0B1F3A" flood-opacity="0.24"/>
    </filter>
  </defs>
  <g filter="url(#ds)">
    <!-- C 环（圆柱体感渐变） -->
    <path d="M37.38 21.76 A12.3 12.3 0 1 1 21.76 37.38"
          stroke="url(#gy)" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- 手腕领圈 + 红色连接件 -->
    <path d="M37 37 L41.5 41.5" stroke="url(#gy)" stroke-width="14.8" stroke-linecap="round" fill="none"/>
    <path d="M40 40 L51 51" stroke="url(#gr)" stroke-width="12.4" stroke-linecap="round" fill="none"/>
    <!-- 内侧夹口圆角高光 -->
    <path d="M26.6 25.1 A9.2 9.2 0 0 1 33.9 19.6" stroke="#FFF3BF" stroke-width="1.8"
          stroke-linecap="round" fill="none" opacity="0.55"/>
  </g>
</svg>