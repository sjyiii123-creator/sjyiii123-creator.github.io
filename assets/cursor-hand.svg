<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#0B2A5B" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="cGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="50%" stop-color="#FFCA1A"/>
      <stop offset="100%" stop-color="#DF9F00"/>
    </linearGradient>
    <linearGradient id="cSleeve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E4E96"/>
      <stop offset="100%" stop-color="#0B2A5B"/>
    </linearGradient>
  </defs>
  <g filter="url(#cShadow)">
    <!-- 袖口 -->
    <path d="M21 25 L26 30 L30 26 L25 21 Z" fill="url(#cSleeve)" stroke="#091E40" stroke-width="1" stroke-linejoin="round"/>
    <!-- 手腕圆柱 -->
    <path d="M16.5 16.5 L23 23" stroke="#C88D00" stroke-width="6.4" stroke-linecap="round"/>
    <path d="M16.5 16.5 L23 23" stroke="url(#cGold)" stroke-width="4.8" stroke-linecap="round"/>
    <!-- C型乐高夹爪（开口朝左上热点 6,6） -->
    <path d="M13.5 5.2 A7.2 7.2 0 1 1 5.2 13.5" fill="none" stroke="#C88D00" stroke-width="5.8" stroke-linecap="round"/>
    <path d="M13.5 5.2 A7.2 7.2 0 1 1 5.2 13.5" fill="none" stroke="url(#cGold)" stroke-width="4.2" stroke-linecap="round"/>
    <!-- 柔和反光 -->
    <path d="M13.2 7.2 A5.4 5.4 0 0 1 17.2 12.5" fill="none" stroke="#FFF9DB" stroke-width="1.3" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
